# ============================================================================
#  电视观看时间表（家长直接改这里即可，不用动代码）
# ============================================================================

# 【禁止观看的时段】格式：开始 结束 名称
#   · 支持跨零点，例如 "21:30 07:00 睡觉"
#   · 到点自动停止受控App 并弹出提醒页，休息结束自动恢复
#   · 想要更多时段，照着格式加一行就行
BLOCK_PERIODS=(
  "07:00 07:30 早饭"
  "12:00 12:40 午饭"
  "17:30 18:30 晚饭"
  "20:30 21:30 写作业"
  "21:30 07:00 睡觉"
)

# 【允许时段内的时长规则】
WATCH_LIMIT_MIN=30      # 单次连续看多久强制休息（分钟）
BREAK_MIN=30            # 强制休息多久（分钟）
DAILY_LIMIT_MIN=120     # 每天累计上限（分钟），0=不限制

# 【睡觉时段】是否顺便把电视熄屏（1=是 0=否）
SCREEN_OFF_ON_SLEEP=0    # 0=不熄屏（熄屏会让电视进入待机，adbd 停止，无法远程控制）

# 【受管控的应用】只有这些会被计时和拦截
# 注意：TVBox 不在此清单（用户明确要求不限制，TVBox 自带家长管控）
WATCH_PACKAGES=(
  "com.ktcp.video"               # 云视听极光
  "com.cmgame.gamehalltv"        # 咪咕游戏TV版
  "com.kwai.tv.yst"              # 快手TV（装了就自动卸）
)

# 【提醒页文案】可自定义
REMINDER_TIP="先去喝口水、看看远处吧"
