# ============================================================================
#  电视 Kiosk 模式配置
#  开机自动进入 TVBox，其余应用一律屏蔽（强制关闭并拉回 TVBox）
# ============================================================================

# 开机要自动启动的 App
KIOSK_PACKAGE="com.github.tvbox.osc.tk"      # TVBox
KIOSK_ACTIVITY=""                              # 留空=自动解析启动页；也可写死 com.github.tvbox.osc.tk/.ui.activity.SplashActivity

# 允许在屏幕上停留的应用（其它一律被强制关闭并拉回 TVBox）
ALLOWED_PACKAGES=(
  "com.github.tvbox.osc.tk"      # TVBox —— 主界面
  "com.example.reminder"         # 休息提醒页（儿童守护用）
  "com.miui.systemAdSolution"    # 系统广告/推荐（避免误伤导致黑屏）
)

# 允许用户临时打开的应用（家长用，例如设置、投屏）
EXTRA_ALLOWED_PACKAGES=(
  "com.android.settings"         # 系统设置
  "com.xiaomi.mitv.settings"    # 小米电视设置
  "com.xiaomi.mitv.appstore"     # 应用商店（注意：放开就等于允许下载）
)

# 检测间隔（秒）——Kiosk 需要较快响应
CHECK_INTERVAL=2

# 电视被强关/系统重启后，延迟多少秒再拉起 TVBox（等系统启动完成）
BOOT_DELAY=45

# 是否受儿童守护的"休息模式"影响：
# 1 = 是（休息期间不拉起 TVBox，交给提醒页显示）；0 = 否
RESPECT_BREAK_MODE=1
